plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.opendicom'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()

	exclusiveContent {
		forRepository { maven { url = 'https://www.dcm4che.org/maven2/' }}
		filter { includeGroup 'org.dcm4che' }
	}
	
	exclusiveContent {
		forRepository { maven { url = 'https://raw.githubusercontent.com/nroduit/mvn-repo/master/'}}
		filter { includeGroup 'org.weasis.core' }
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.dcm4che:dcm4che-core:5.35.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
